# pip-audit advisory suppressions — DATA, not flags.
#
# The `--ignore-vuln` flags in .github/workflows/security-scan.yml are GENERATED
# from this file by scripts/check_suppressions.py --emit-flags. Never hand-add a
# flag to the workflow: a hand-added flag bypasses the expiry recheck entirely,
# which is exactly how 19 advisories stayed hidden for two months.
#
# WHY THIS FILE EXISTS
# The previous ignore list lived as bash flags with rationale comments. Two
# things went wrong, and both are structural rather than careless:
#   1. `--ignore-vuln` hides an advisory UNCONDITIONALLY, including after a fix
#      ships. The Twisted entry said "Remove when Twisted >=26.4.0 stable
#      releases." It did. Nothing was watching, because the gate could no longer
#      see the advisory it was told to ignore.
#   2. The list's header pointed at "todo 089" for tracking. Todo 089 was real —
#      and completed and archived. A pointer to a CLOSED artifact reads as live
#      tracking; a broken link would at least have been noticed.
# Hence: every entry carries an `expires` date and a `tracked_by` todo id, and
# scripts/check_suppressions.py fails the build when either goes stale.
#
# RUN LOCALLY
#   cd backend && pip-audit -r requirements.txt ${=$(python3 ../scripts/check_suppressions.py --emit-flags)}
# NOTE the ${=...}: this project's shell is zsh, which does NOT word-split an
# unquoted $VAR. Without it pip-audit receives ONE argument and silently audits
# nothing — a check that reports "nothing to do" did not run.
#
# ...BUT NEVER USE THAT COMMAND TO RE-ASSESS AN ENTRY IN THIS FILE.
# --emit-flags emits `--ignore-vuln` for every id below, so a suppressed audit is
# structurally incapable of reporting the entries it is meant to re-assess: it
# hands you a clean result guaranteed by construction. That trap was written into
# a real re-assessment procedure (todo 366) and caught only in review. To assess
# an entry, audit UNSUPPRESSED:
#   cd backend && pip-audit -r requirements.txt --format json --output /tmp/audit.json
#   python3 ../scripts/check_suppressions.py --recheck --report /tmp/audit.json
# Same reason security-scan.yml:40 writes an unsuppressed report for --recheck to
# read. The two commands answer different questions: the suppressed one asks "is
# the gate green?", the unsuppressed one asks "is this entry still true?".

version: 1

policy:
  # An entry may not be granted a longer initial window than this.
  max_expiry_days: 180

pip_audit:
  - id: PYSEC-2026-89
    package: Markdown
    pinned: "3.8.1"
    reason: >-
      No upstream fix (OSV: all versions affected); markdown is not imported by
      app code and the DoS path is unreachable. NOTE 2026-09-05: pip-audit no
      longer reports this id at all, so this entry currently suppresses nothing.
      Left in place pending re-assessment at `expires` rather than removed on one
      day's data.
    clears_when: An upstream Markdown release addresses the advisory.
    added: "2026-05-20"
    expires: "2026-11-16"
    owner: "@Xertox1234"
    tracked_by: "366"

  - id: PYSEC-2025-183
    package: PyJWT
    pinned: "2.13.0"
    reason: >-
      Supplier-disputed; mitigated by JWT_SECRET_KEY (the SIMPLE_JWT SIGNING_KEY
      PyJWT signs with), validated >=50 chars fail-fast at settings import in ALL
      environments (backend/plant_community_backend/settings.py:658). NOTE
      2026-09-05: pip-audit no longer reports this id at all, so this entry
      currently suppresses nothing. Left in place pending re-assessment at
      `expires` rather than removed on one day's data.
    clears_when: The advisory is withdrawn, or a patched PyJWT ships.
    added: "2026-05-20"
    expires: "2026-11-16"
    owner: "@Xertox1234"
    tracked_by: "366"
