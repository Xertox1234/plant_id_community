name: Harness CI

# Runs the harness's own test suite.
#   - pull_request to main/develop: ALWAYS (no path filter). This job is a
#     REQUIRED status check; a path-filtered required check deadlocks every PR
#     that doesn't touch the harness — GitHub waits forever for a check that
#     never reports. The tests are fast and exercise repo-resident harness code,
#     so running them on every PR is cheap and keeps the required check honest.
#     Scope note: "harness code" now also covers the security-suppression
#     validator (scripts/check_suppressions.py). It belongs here rather than in
#     security-scan.yml because --validate is schema-and-policy only — it never
#     fails from the passage of time or from a newly published CVE, so it is safe
#     on every PR, and a malformed suppression should be caught before it merges
#     rather than a week later on the schedule.
#   - push to main/develop: only when the harness itself changes (.claude/hooks/,
#     scripts/inject/, docs/rules/, or this workflow).
#
# Local equivalent (run from repo root):
#   bash .claude/hooks/test-inject-patterns.sh && \
#   bash .claude/hooks/test-kimi-review.sh && \
#   bash .claude/hooks/test-guard-worktree-isolation.sh && \
#   bash .claude/hooks/test-check-test-env.sh && \
#   python3 scripts/inject/test_match_triggers.py && \
#   python3 scripts/inject/test_capture_trigger.py && \
#   python3 scripts/inject/test_capture_from_review.py && \
#   python3 scripts/test_check_rules_drift.py

'on':
  push:
    branches: [main, develop]
    paths:
      - '.claude/hooks/**'
      - 'scripts/inject/**'
      - 'docs/rules/**'
      - 'scripts/check_suppressions.py'
      - 'scripts/test_check_suppressions.py'
      - 'scripts/new_vuln_gate.py'
      - 'scripts/test_new_vuln_gate.py'
      - 'scripts/check_rules_drift.py'
      - 'scripts/test_check_rules_drift.py'
      - '.github/security-suppressions.yml'
      - '.github/workflows/harness-ci.yml'
  pull_request:
    branches: [main, develop]

# Least-privilege GITHUB_TOKEN. An explicit top-level block REPLACES the repo
# default (`default_workflow_permissions: read`) rather than narrowing it, so
# every scope any job here needs must be listed. See docs/rules/security.md.
permissions:
  contents: read

jobs:
  harness-tests:
    name: Hook self-tests and Python inject tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Hook self-tests
        run: |
          pip install ruff==0.15.17  # for test-format-on-edit.sh (matches backend/requirements.txt)
          bash .claude/hooks/test-inject-patterns.sh
          bash .claude/hooks/test-kimi-review.sh
          bash .claude/hooks/test-guard-worktree-isolation.sh
          bash .claude/hooks/test-format-on-edit.sh
          bash .claude/hooks/test-check-test-env.sh

      - name: Python inject tests
        run: |
          python3 scripts/inject/test_match_triggers.py
          python3 scripts/inject/test_capture_trigger.py
          python3 scripts/inject/test_capture_from_review.py

      - name: Security suppression validator
        run: |
          pip install pyyaml
          python3 scripts/test_check_suppressions.py
          # Schema + policy on the real file. Never time-dependent, so a
          # suppression expiring mid-review cannot block an unrelated PR; the
          # expiry recheck lives in security-scan.yml's scheduled run.
          python3 scripts/check_suppressions.py --validate

      - name: New-advisory gate
        run: python3 scripts/test_new_vuln_gate.py

      # Offline: drives a fake session, never touches the network or a credential.
      # The live comparison it backs runs in firebase-rules-drift.yml, which is not
      # a required check because it needs a secret and reports on production state.
      - name: Firebase rules drift checker tests
        run: python3 scripts/test_check_rules_drift.py
