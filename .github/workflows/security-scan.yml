name: Security Dependency Scan

on:
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Mondays at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-security:
    name: Backend Python Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install pip-audit pyyaml

      - name: Run pip-audit (JSON report)
        run: |
          cd backend
          pip-audit -r requirements.txt --format json --output pip-audit-report.json || true
        continue-on-error: true

      # Suppressions live in .github/security-suppressions.yml as DATA, and the
      # --ignore-vuln flags below are GENERATED from it. Never hand-add a flag
      # here: a hand-added flag is invisible to the expiry recheck, which is how
      # eight advisories stayed hidden for two months.
      - name: Validate security suppressions (schema + policy)
        run: python3 scripts/check_suppressions.py --validate

      - name: Generate pip-audit suppression flags
        id: suppressions
        run: echo "flags=$(python3 scripts/check_suppressions.py --emit-flags)" >> "$GITHUB_OUTPUT"

      - name: Run pip-audit (advisory on PR, blocking on schedule/main)
        id: audit
        env:
          # Passed via env, never interpolated into `run:` directly.
          IGNORE_FLAGS: ${{ steps.suppressions.outputs.flags }}
        run: |
          cd backend
          pip-audit -r requirements.txt $IGNORE_FLAGS
        continue-on-error: true

      # PR runs are advisory-only: a fixable CVE with no code change yet shouldn't block
      # every open branch at once (hit 3x: bleach, PyJWT, pillow). The weekly schedule run
      # (and manual workflow_dispatch) still hard-fails so it's caught within a week either way.
      - name: Enforce pip-audit result (blocking outside pull_request)
        if: steps.audit.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          echo "pip-audit found vulnerabilities with available fixes on a ${{ github.event_name }} run — failing the gate."
          exit 1

      - name: Flag advisory-only pip-audit failure on PRs
        if: steps.audit.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::warning::pip-audit found vulnerabilities with available fixes. Not blocking this PR (advisory-only on pull_request runs) — will hard-fail on the next scheduled scan against main."

      # The suppression expiry gate. Reads the UNSUPPRESSED report written above,
      # so it sees advisories the --ignore-vuln flags hide from the audit step.
      # Fails when a suppression outlived its reason: expiry passed, a fix
      # shipped, or its tracked_by todo was archived/closed.
      - name: Recheck suppressions for shipped fixes (blocking outside pull_request)
        if: always() && github.event_name != 'pull_request'
        run: |
          python3 scripts/check_suppressions.py --recheck \
            --report backend/pip-audit-report.json

      - name: Flag suppression drift (advisory on PRs)
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 scripts/check_suppressions.py --recheck \
            --report backend/pip-audit-report.json --warn-only

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json
          retention-days: 30

      - name: Comment PR with vulnerabilities (if any)
        if: steps.audit.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Security vulnerabilities detected in Python dependencies (advisory only — not blocking this PR)**\n\nA dependency has a known vulnerability with an available fix. This does not block merge, but will start failing the weekly scheduled scan until resolved.\n\nPlease check the pip-audit report in the workflow artifacts for details.\n\nRun locally: `cd backend && pip-audit -r requirements.txt`'
            })

  frontend-security:
    name: Frontend npm Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm ci

      - name: Run npm audit (JSON report)
        run: |
          cd web
          npm audit --json > npm-audit-report.json || true
        continue-on-error: true

      - name: Run npm audit (advisory on PR, blocking on schedule/main)
        id: audit
        run: |
          cd web
          npm audit --audit-level=moderate
        continue-on-error: true

      # PR runs are advisory-only: a fixable CVE with no code change yet shouldn't block
      # every open branch at once (hit 3x: bleach, PyJWT, pillow). The weekly schedule run
      # (and manual workflow_dispatch) still hard-fails so it's caught within a week either way.
      - name: Enforce npm audit result (blocking outside pull_request)
        if: steps.audit.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          echo "npm audit found moderate+ vulnerabilities on a ${{ github.event_name }} run — failing the gate."
          exit 1

      - name: Flag advisory-only npm audit failure on PRs
        if: steps.audit.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::warning::npm audit found moderate+ vulnerabilities. Not blocking this PR (advisory-only on pull_request runs) — will hard-fail on the next scheduled scan against main."

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: npm-audit-report
          path: web/npm-audit-report.json
          retention-days: 30

      - name: Comment PR with vulnerabilities (if any)
        if: steps.audit.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Security vulnerabilities detected in npm dependencies (advisory only — not blocking this PR)**\n\nA dependency has a known vulnerability at moderate+ severity. This does not block merge, but will start failing the weekly scheduled scan until resolved.\n\nPlease check the npm audit report in the workflow artifacts for details.\n\nRun locally: `cd web && npm audit`'
            })

  mobile-security:
    name: Flutter Dependency Security Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to match mobile-ci.yml / local dev — see that file's
          # comment (2026-08-17 Gradle-drift fix).
          flutter-version: '3.41.9'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies for security scanner
        run: |
          pip install --upgrade pip
          pip install PyYAML

      - name: Get Flutter dependencies
        run: |
          cd plant_community_mobile
          flutter pub get

      - name: Run Flutter security scanner
        run: |
          python scripts/check_flutter_security.py
        continue-on-error: false

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: flutter-sbom
          path: plant_community_mobile/sbom.json
          retention-days: 90

      - name: Upload Flutter outdated report (if exists)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: flutter-outdated-report
          path: plant_community_mobile/flutter-outdated.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment PR with outdated packages (if any)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Flutter dependency issues detected**\n\nPlease check the Flutter security report in the workflow artifacts for details.\n\nRun locally: `source backend/venv/bin/activate && python scripts/check_flutter_security.py`'
            })

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [backend-security, frontend-security, mobile-security]
    if: always()
    permissions:
      contents: read
      # The alarm opens/updates/closes a tracking issue. Explicit, because the
      # repo default is `read` and the top-level block grants contents only.
      issues: write

    steps:
      - uses: actions/checkout@v5

      # Three steps, not one. The verdict has to be computed BEFORE the alarm
      # runs and the gate fails: the previous single step ended in `exit 1`,
      # so anything appended after it never executed.
      - name: Compute scan verdict
        id: verdict
        run: |
          echo "Security scan completed for all platforms"
          echo "Backend: ${{ needs.backend-security.result }}"
          echo "Frontend: ${{ needs.frontend-security.result }}"
          echo "Mobile: ${{ needs.mobile-security.result }}"

          if [[ "${{ needs.backend-security.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-security.result }}" == "failure" ]] || \
             [[ "${{ needs.mobile-security.result }}" == "failure" ]]; then
            echo "⚠️ Security vulnerabilities detected! Please review the reports."
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ No security vulnerabilities detected"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      # PR runs stay advisory-only (the deliberate choice documented above), so
      # they must not file issues. Only schedule/workflow_dispatch reach here.
      - name: Security scan alarm (open / update / close the tracking issue)
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.verdict.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKEND_RESULT: ${{ needs.backend-security.result }}
          FRONTEND_RESULT: ${{ needs.frontend-security.result }}
          MOBILE_RESULT: ${{ needs.mobile-security.result }}
        run: bash .github/scripts/security_alarm.sh

      - name: Fail the gate
        if: steps.verdict.outputs.failed == 'true'
        run: exit 1
