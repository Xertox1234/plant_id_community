name: Security Dependency Scan

on:
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Mondays at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-security:
    name: Backend Python Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install pip-audit pyyaml

      - name: Run pip-audit (JSON report)
        run: |
          cd backend
          pip-audit -r requirements.txt --format json --output pip-audit-report.json || true
        continue-on-error: true

      # Suppressions live in .github/security-suppressions.yml as DATA, and the
      # --ignore-vuln flags below are GENERATED from it. Never hand-add a flag
      # here: a hand-added flag is invisible to the expiry recheck, which is how
      # eight advisories stayed hidden for two months.
      - name: Validate security suppressions (schema + policy)
        run: python3 scripts/check_suppressions.py --validate

      - name: Generate pip-audit suppression flags
        id: suppressions
        run: echo "flags=$(python3 scripts/check_suppressions.py --emit-flags)" >> "$GITHUB_OUTPUT"

      - name: Run pip-audit (advisory on PR, blocking on schedule/main)
        id: audit
        env:
          # Passed via env, never interpolated into `run:` directly.
          IGNORE_FLAGS: ${{ steps.suppressions.outputs.flags }}
        run: |
          cd backend
          pip-audit -r requirements.txt $IGNORE_FLAGS
        continue-on-error: true

      # PR runs are advisory-only: a fixable CVE with no code change yet shouldn't block
      # every open branch at once (hit 3x: bleach, PyJWT, pillow). The weekly schedule run
      # (and manual workflow_dispatch) still hard-fails so it's caught within a week either way.
      - name: Enforce pip-audit result (blocking outside pull_request)
        if: steps.audit.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          echo "pip-audit found vulnerabilities with available fixes on a ${{ github.event_name }} run — failing the gate."
          exit 1

      - name: Flag advisory-only pip-audit failure on PRs
        if: steps.audit.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::warning::pip-audit found vulnerabilities with available fixes. Not blocking this PR (advisory-only on pull_request runs) — will hard-fail on the next scheduled scan against main."

      # The suppression expiry gate. Reads the UNSUPPRESSED report written above,
      # so it sees advisories the --ignore-vuln flags hide from the audit step.
      # Fails when a suppression outlived its reason: expiry passed, a fix
      # shipped, or its tracked_by todo was archived/closed.
      - name: Recheck suppressions for shipped fixes (blocking outside pull_request)
        if: always() && github.event_name != 'pull_request'
        run: |
          python3 scripts/check_suppressions.py --recheck \
            --report backend/pip-audit-report.json

      - name: Flag suppression drift (advisory on PRs)
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 scripts/check_suppressions.py --recheck \
            --report backend/pip-audit-report.json --warn-only

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json
          retention-days: 30

      - name: Comment PR with vulnerabilities (if any)
        if: steps.audit.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Security vulnerabilities detected in Python dependencies (advisory only — not blocking this PR)**\n\nA dependency has a known vulnerability with an available fix. This does not block merge, but will start failing the weekly scheduled scan until resolved.\n\nPlease check the pip-audit report in the workflow artifacts for details.\n\nRun locally: `cd backend && pip-audit -r requirements.txt`'
            })

  frontend-security:
    name: Frontend npm Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # BOTH manifests, not just web/. The ROOT package.json is the Cloudflare
      # Workers deploy artifact — Workers Builds runs `npm clean-install` there
      # and ships `npx wrangler versions upload` from it — and hardcoding `web/`
      # in every npm step of this job is what kept 14 root advisories invisible
      # to the repo's own scanner for the whole life of this workflow. The
      # weekly hard-fail could not have caught them, and did not; only
      # Dependabot ever surfaced them.
      #
      # The set comes from NPM_MANIFEST_DIRS in the gate script, which carries a
      # drift test, so a third lockfile cannot appear unscanned. Never write a
      # directory name into this job again. See docs/rules/security.md, todo 356.
      # (`python3` is the runner's preinstalled interpreter; the script is
      # stdlib-only and needs no setup-python.)
      - name: Resolve the npm manifests to audit
        id: manifests
        run: |
          set -euo pipefail
          DIRS="$(python3 scripts/new_vuln_gate.py --list-npm-dirs)"
          # An empty list would turn every loop below into a no-op and this job
          # into a silent green scan of zero manifests — the same shape as the
          # bug being fixed. Assert the list HERE, where the failing command's
          # output is directly above (docs/rules/security.md).
          if [ -z "$DIRS" ]; then
            echo "::error::--list-npm-dirs returned nothing; refusing to report a clean scan of zero manifests"
            exit 1
          fi
          echo "manifests to audit: $DIRS"
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"

      # --package-lock-only resolves straight from the lockfile, so there is no
      # `npm ci` step at all. Verified equivalent against PR #669's base root
      # lockfile (15 advisories; identical id sets with and without the
      # install), and it is already the flag new-vuln-gate uses. It also avoids
      # running the root tree's native install scripts (workerd, esbuild) for a
      # scan that never executes the code.
      - name: Run npm audit (JSON report)
        env:
          DIRS: ${{ steps.manifests.outputs.dirs }}
        run: |
          read -ra MANIFEST_DIRS <<< "$DIRS"
          mkdir -p npm-audit-reports
          for dir in "${MANIFEST_DIRS[@]}"; do
            if [ "$dir" = "." ]; then
              slug=root
            else
              # A nested manifest (firebase/functions) would otherwise make a
              # slug containing "/", and the redirect below would fail on the
              # missing parent directory — swallowed by `|| true`, so that
              # manifest would silently contribute no report.
              slug="${dir//\//-}"
            fi
            (cd "$dir" && npm audit --package-lock-only --json) \
              > "npm-audit-reports/$slug.json" || true
            # `|| true` cannot tell "advisories found" (npm audit's normal
            # non-zero) from "npm audit crashed", so an empty report would be
            # uploaded as an artefact and read as "nothing found". The gate
            # VERDICT is safe either way — the audit step below decides it — but
            # the file a human opens to triage must not be a silent lie.
            # docs/rules/security.md: the step that produces an artefact asserts
            # it produced it.
            if [ ! -s "npm-audit-reports/$slug.json" ]; then
              echo "::error::npm audit --json produced no report for '$dir' - see its output above"
            fi
          done
        continue-on-error: true

      - name: Run npm audit (advisory on PR, blocking on schedule/main)
        id: audit
        env:
          DIRS: ${{ steps.manifests.outputs.dirs }}
        run: |
          read -ra MANIFEST_DIRS <<< "$DIRS"
          rc=0
          for dir in "${MANIFEST_DIRS[@]}"; do
            echo "::group::npm audit --audit-level=moderate (cwd: $dir)"
            # --package-lock-only audits the LOCKFILE, so a dependency declared
            # in package.json but absent from the lockfile is never looked at
            # and the audit still reports "found 0 vulnerabilities". `npm ci`
            # used to hard-fail on that skew; it is gone from this job, and no
            # other workflow installs the ROOT tree (web/ is covered by
            # web-ci.yml). Check the sync explicitly, at the same severity as
            # the audit itself: advisory on PRs, blocking on schedule/dispatch.
            if ! (cd "$dir" && npm ls --package-lock-only >/dev/null); then
              echo "::warning::'$dir' package.json and package-lock.json disagree — the audit below cannot see a dependency the lockfile omits"
              rc=1
            fi
            if (cd "$dir" && npm audit --package-lock-only --audit-level=moderate); then
              echo "clean: $dir"
            else
              echo "::warning::npm audit found moderate+ vulnerabilities in '$dir'"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit "$rc"
        continue-on-error: true

      # PR runs are advisory-only: a fixable CVE with no code change yet shouldn't block
      # every open branch at once (hit 3x: bleach, PyJWT, pillow). The weekly schedule run
      # (and manual workflow_dispatch) still hard-fails so it's caught within a week either way.
      - name: Enforce npm audit result (blocking outside pull_request)
        if: steps.audit.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          echo "npm audit found moderate+ vulnerabilities on a ${{ github.event_name }} run — failing the gate."
          exit 1

      - name: Flag advisory-only npm audit failure on PRs
        if: steps.audit.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::warning::npm audit found moderate+ vulnerabilities. Not blocking this PR (advisory-only on pull_request runs) — will hard-fail on the next scheduled scan against main."

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: npm-audit-report
          path: npm-audit-reports/
          retention-days: 30

      - name: Comment PR with vulnerabilities (if any)
        if: steps.audit.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Security vulnerabilities detected in npm dependencies (advisory only — not blocking this PR)**\n\nA dependency has a known vulnerability at moderate+ severity. This does not block merge, but will start failing the weekly scheduled scan until resolved.\n\nPlease check the npm audit report in the workflow artifacts for details — it names the manifest.\n\nRun locally, in **both** trees (the repo root is the Cloudflare Workers deploy tree, `web/` is the React app):\n\n```\nnpm audit --package-lock-only\ncd web && npm audit --package-lock-only\n```'
            })

  mobile-security:
    name: Flutter Dependency Security Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to match mobile-ci.yml / local dev — see that file's
          # comment (2026-08-17 Gradle-drift fix).
          flutter-version: '3.41.9'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies for security scanner
        run: |
          pip install --upgrade pip
          pip install PyYAML

      - name: Get Flutter dependencies
        run: |
          cd plant_community_mobile
          flutter pub get

      - name: Run Flutter security scanner
        run: |
          python scripts/check_flutter_security.py
        continue-on-error: false

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: flutter-sbom
          path: plant_community_mobile/sbom.json
          retention-days: 90

      - name: Upload Flutter outdated report (if exists)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: flutter-outdated-report
          path: plant_community_mobile/flutter-outdated.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment PR with outdated packages (if any)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Flutter dependency issues detected**\n\nPlease check the Flutter security report in the workflow artifacts for details.\n\nRun locally: `source backend/venv/bin/activate && python scripts/check_flutter_security.py`'
            })

  # Block a PR that ADDS an advisory, without being red from the existing
  # backlog. Both sides are audited in THIS run against the same advisory
  # database, so a newly published CVE lands on base and head together and
  # cancels out — it cannot block an unrelated branch. That is the specific
  # failure (bleach, PyJWT, pillow, 3x) that made the PR half of this workflow
  # advisory-only; this job is the narrow gate that can be blocking instead.
  #
  # NOT in branch protection yet, deliberately. On 2026-09-05 requiring the
  # CodeQL `Analyze (<lang>)` contexts deadlocked every Dependabot PR, because
  # CodeQL default setup does not run on them. Let this job report on real PRs
  # — including a Dependabot one — before requiring it. See docs/LEARNINGS.md.
  new-vuln-gate:
    name: No new dependency advisories
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      # fetch-depth: 0 is load-bearing. At the default depth 1 the base commit
      # is absent, `git show $BASE:file` fails, and a gate that cannot read its
      # own baseline would pass unconditionally.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the merge base and the changed manifests
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::error::base commit $BASE_SHA is not present — refusing to pass a gate that cannot read its baseline"
            exit 1
          fi
          mkdir -p /tmp/gate
          git diff --name-only "$BASE_SHA" HEAD > /tmp/gate/changed.txt
          echo "changed files:"; sed 's/^/  /' /tmp/gate/changed.txt
          # The scope predicates live in the gate script (NPM_MANIFEST_DIRS,
          # npm_dirs_from_changes, pip_changed), where harness-ci tests them.
          # They used to be two `grep -qE` patterns right here, and the npm one
          # answered `npm=true` for a ROOT lockfile change while the audit step
          # below read `web/` regardless — so the gate printed a confident
          # `0 advisories on base, 0 on head, 0 new` about a tree the PR had
          # never touched. A false green, not a skip. Detection was right; the
          # action was pointed at the wrong tree, so BOTH now come from the same
          # tested function. See docs/rules/security.md, todo 356.
          python3 scripts/new_vuln_gate.py --scope --changed-files /tmp/gate/changed.txt \
            | tee -a "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.scope.outputs.pip == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Audit backend base and head
        if: steps.scope.outputs.pip == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          pip install pip-audit
          mkdir -p /tmp/gate
          git show "$BASE_SHA:backend/requirements.txt" > /tmp/gate/base-requirements.txt
          # `cd backend` is load-bearing. requirements.txt ends with
          # `-e ./packages/wagtail_forum`, a path relative to THAT directory, and
          # pip resolves relative requirement paths against the CURRENT WORKING
          # DIRECTORY, not against the requirements file. Auditing from the repo
          # root made pip reject it ("not a valid editable requirement"), so both
          # audits produced no JSON and the compare step below died on a missing
          # baseline -- the pip half of this gate had never once returned a result.
          # The blocking `backend-security` job above got this right by accident,
          # because it happens to `cd backend` for unrelated reasons.
          cd backend
          # `|| true`: pip-audit exits non-zero merely because advisories exist.
          # The report is the artefact we want; the diff decides pass/fail.
          pip-audit -r /tmp/gate/base-requirements.txt --format json \
            --output /tmp/gate/base-pip.json || true
          pip-audit -r requirements.txt --format json \
            --output /tmp/gate/head-pip.json || true
          # That `|| true` cannot tell "advisories found" from "pip-audit crashed",
          # which is exactly how the cwd bug stayed invisible. Assert the artefacts
          # HERE, where the failing command's output is directly above, rather than
          # letting the compare step report a missing file two steps later.
          for f in /tmp/gate/base-pip.json /tmp/gate/head-pip.json; do
            if [ ! -s "$f" ]; then
              echo "::error::pip-audit produced no report at $f - see its output above"
              exit 1
            fi
          done

      - name: Set up Node.js
        if: steps.scope.outputs.npm_dirs != ''
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # One base/head pair per CHANGED manifest, each against its own base. This
      # step used to read `web/` unconditionally, which is the todo-356 bug: a
      # PR that changed only the root lockfile compared web/ to web/, got an
      # identical pair, and passed. The loop reads the same $NPM_DIRS the
      # compare step below reads, so the two cannot disagree silently.
      - name: Audit npm base and head (every changed manifest)
        if: steps.scope.outputs.npm_dirs != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NPM_DIRS: ${{ steps.scope.outputs.npm_dirs }}
        run: |
          set -euo pipefail
          read -ra NPM_DIR_LIST <<< "$NPM_DIRS"
          for dir in "${NPM_DIR_LIST[@]}"; do
            if [ "$dir" = "." ]; then
              slug=root
              prefix=""
            else
              slug="${dir//\//-}"
              prefix="$dir/"
            fi
            basetree="/tmp/gate/base-npm-$slug"
            mkdir -p "$basetree"
            git show "$BASE_SHA:${prefix}package.json"      > "$basetree/package.json"
            git show "$BASE_SHA:${prefix}package-lock.json" > "$basetree/package-lock.json"
            # --package-lock-only: resolve from the lockfile, no install.
            (cd "$basetree" && npm audit --package-lock-only --json > "/tmp/gate/base-npm-$slug.json" || true)
            (cd "$dir"      && npm audit --package-lock-only --json > "/tmp/gate/head-npm-$slug.json" || true)
            # Same assertion as the pip side: a crashed audit and a clean audit are
            # indistinguishable through `|| true`, and silence must not read as pass.
            for f in "/tmp/gate/base-npm-$slug.json" "/tmp/gate/head-npm-$slug.json"; do
              if [ ! -s "$f" ]; then
                echo "::error::npm audit produced no report at $f (manifest '$dir') - see its output above"
                exit 1
              fi
            done
          done

      # Dependabot is exempt from BLOCKING, not from reporting. Every Dependabot
      # PR here exists to close advisories (the config is security-updates-only),
      # and a bump that closes several can surface one new transitive advisory —
      # failing those PRs would be backwards. The new ids are still printed and
      # annotated.
      - name: Compare base against head
        env:
          IS_BOT: ${{ github.actor == 'dependabot[bot]' }}
          PIP: ${{ steps.scope.outputs.pip }}
          NPM_DIRS: ${{ steps.scope.outputs.npm_dirs }}
        run: |
          set -euo pipefail
          # `if` blocks rather than `[ x ] && ARGS+=(...)`: the AND form is
          # actually `set -e`-safe (the failing `[` is not the command after the
          # final &&), but it IS fragile — moving such a line to the end of the
          # script silently makes the step exit 1. Spelled out, it cannot rot.
          ARGS=()
          if [ "$PIP" = "true" ]; then
            ARGS+=(--base-pip /tmp/gate/base-pip.json --head-pip /tmp/gate/head-pip.json)
          fi
          # The same list the audit step looped over. If that loop skipped a
          # manifest this one names, the report file is absent and the gate
          # fails loudly rather than reporting on a tree it never read.
          if [ -n "$NPM_DIRS" ]; then
            read -ra NPM_DIR_LIST <<< "$NPM_DIRS"
            for dir in "${NPM_DIR_LIST[@]}"; do
              if [ "$dir" = "." ]; then
                slug=root
              else
                slug="${dir//\//-}"
              fi
              ARGS+=(--npm-pair "$dir" "/tmp/gate/base-npm-$slug.json" "/tmp/gate/head-npm-$slug.json")
            done
          fi
          if [ "$IS_BOT" = "true" ]; then
            ARGS+=(--warn-only)
          fi
          # ${ARGS[@]+"${ARGS[@]}"} expands to nothing when empty, which `set -u`
          # would otherwise treat as an unbound variable on older bash.
          python3 scripts/new_vuln_gate.py --format github ${ARGS[@]+"${ARGS[@]}"}

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [backend-security, frontend-security, mobile-security]
    if: always()
    permissions:
      contents: read
      # The alarm opens/updates/closes a tracking issue. Explicit, because the
      # repo default is `read` and the top-level block grants contents only.
      issues: write

    steps:
      - uses: actions/checkout@v5

      # Three steps, not one. The verdict has to be computed BEFORE the alarm
      # runs and the gate fails: the previous single step ended in `exit 1`,
      # so anything appended after it never executed.
      - name: Compute scan verdict
        id: verdict
        run: |
          echo "Security scan completed for all platforms"
          echo "Backend: ${{ needs.backend-security.result }}"
          echo "Frontend: ${{ needs.frontend-security.result }}"
          echo "Mobile: ${{ needs.mobile-security.result }}"

          if [[ "${{ needs.backend-security.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-security.result }}" == "failure" ]] || \
             [[ "${{ needs.mobile-security.result }}" == "failure" ]]; then
            echo "⚠️ Security vulnerabilities detected! Please review the reports."
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ No security vulnerabilities detected"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      # PR runs stay advisory-only (the deliberate choice documented above), so
      # they must not file issues. Only schedule/workflow_dispatch reach here.
      - name: Security scan alarm (open / update / close the tracking issue)
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.verdict.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKEND_RESULT: ${{ needs.backend-security.result }}
          FRONTEND_RESULT: ${{ needs.frontend-security.result }}
          MOBILE_RESULT: ${{ needs.mobile-security.result }}
        run: bash .github/scripts/security_alarm.sh

      - name: Fail the gate
        if: steps.verdict.outputs.failed == 'true'
        run: exit 1
