name: Backend CI

# Lint gate (closes the todo-132 gap): black, isort and ruff run here over
# every tracked backend/*.py with the SAME pins, args and file scope as
# .pre-commit-config.yaml, by running those three pre-commit hooks directly.
# Before this, lint was pre-commit-only and `git commit --no-verify` bypassed
# it entirely; the full-tree gate became possible once the frozen debt was
# cleared (179 findings -> 0, PR #1158). ruff replaced flake8 (2026-10-18) with
# the bug-finding rule families; its config is backend/pyproject.toml
# [tool.ruff], and the only per-file-ignore left is the import-smoke-test.

'on':
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.python-version'
      - '.pre-commit-config.yaml'
  pull_request:
    branches: [main, develop]
    # No path filter on pull_request: the backend-checks job is a required
    # status check, so it must report on every PR. A path-filtered required
    # check never reports on PRs that miss the filter (e.g. docs-only changes),
    # which permanently blocks the merge.

# Least-privilege GITHUB_TOKEN. An explicit top-level block REPLACES the repo
# default (`default_workflow_permissions: read`) rather than narrowing it, so
# every scope any job here needs must be listed. See docs/rules/security.md.
permissions:
  contents: read

jobs:
  backend-checks:
    name: Install dependencies and run Django checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DEBUG: 'True'
      ENABLE_FILE_LOGGING: 'False'
      DATABASE_URL: 'sqlite:///db.sqlite3'
      SECRET_KEY: 'ci-django-key-for-backend-checks-abcdefghijklmnopqrstuvwxyz1234567890'
      JWT_SECRET_KEY: 'ci-jwt-key-for-backend-checks-abcdefghijklmnopqrstuvwxyz1234567890-different'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run Django system checks
        run: python manage.py check

      - name: Restore pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-lint-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint (black, isort, ruff via the pre-commit hooks)
        # Runs from the repo root, where .pre-commit-config.yaml lives. ruff
        # finds backend/pyproject.toml hierarchically, so the cwd does not
        # change which config applies. `pre-commit run` takes one hook id per
        # call. --all-files applies each hook's `files:` filter
        # (^backend/.*\.py$), the same scope the local commit hook sees.
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install pre-commit==4.6.0
          pre-commit run black --all-files --show-diff-on-failure
          pre-commit run isort --all-files --show-diff-on-failure
          pre-commit run ruff-check --all-files

      - name: Start-script self-test (bin/start.sh supervision rules)
        # The Railway start command runs gunicorn + the Celery worker in one
        # container (todo 335). Proves: a dead gunicorn takes the container
        # down (so Railway restarts it); a dead worker is restarted in-container
        # up to its budget, then escalates; SIGTERM reaches both. Pure bash >= 5.1.
        run: bash bin/test-start.sh

      - name: Check for missing migrations
        # Fails the build when a model change has no accompanying migration
        # (L17, todo 261). `--check` exits non-zero if makemigrations WOULD
        # create a migration; `--dry-run` stops it from writing one. Migration
        # DETECTION compares model state to the migration files (not the live
        # schema), so the SQLite settings used above are fine here.
        run: python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema generation
        # Catches serializer<->model field drift: a serializer referencing a
        # non-existent model field raises ImproperlyConfigured during generation,
        # which silently breaks /api/schema, /api/docs and /api/redoc AND crashes
        # the affected endpoint at runtime. --validate also rejects malformed
        # generated OpenAPI documents. --fail-on-warn fails on any generator
        # warning or error too (todo 581): a view whose request or response
        # shape drf-spectacular cannot see needs an @extend_schema, so /api/docs
        # never silently drops an endpoint's shapes.
        run: python manage.py spectacular --file /dev/null --validate --fail-on-warn

      - name: Type-check the gated paths (mypy + django-stubs)
        # The gated paths are `files` in pyproject.toml [tool.mypy] (apps/users
        # since todo 580, plant_community_backend since 2026-10-19), which a
        # bare `python -m mypy` checks; the
        # mypy-staged pre-commit hook blocks on the same list at commit time.
        # pyproject.toml loads the django-stubs plugin with this job's settings
        # env and sets follow_imports=silent, so only the gated files report
        # errors. Tests are excluded (the `apps.*.tests.*` ignore_errors
        # override, owner decision 2026-10-19). Widen the gate by adding a
        # path to `files`, nowhere else.
        run: python -m mypy

      - name: mypy gate self-test (a planted error in apps/users must fail it; one in apps/users/tests must not)
        # follow_imports=silent hides errors in imported-only modules; this
        # proves the named app still reports, so config drift cannot turn the
        # gate above green by emptiness (todo 599 item 4), and that the tests
        # exclusion still matches.
        run: bash bin/test-mypy-gate.sh

  backend-tests:
    name: Run backend test suite (pytest, postgres + redis)
    runs-on: ubuntu-latest

    # Shares this workflow's `on:` triggers with backend-checks: push is
    # path-filtered; pull_request is NOT (see the comment at the top of this
    # file — a path-filtered REQUIRED check never reports on off-path PRs and
    # permanently blocks the merge). For this job to actually block a merge it
    # must also be added to the branch-protection required-status-checks list;
    # the workflow only makes the check exist and report.

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # settings.py accepts DATABASE_URL for pytest and validates that it is
        # PostgreSQL; local pytest without a URL uses the TEST_DB_* PostgreSQL
        # defaults. pytest-django creates `test_plant_community` from this service.
        # pgvector image (Postgres 16 + the `vector` extension preinstalled) so
        # the forum similar-topics `CREATE EXTENSION vector` migration applies in
        # CI (todo 255 slice 4 / H15). Stock postgres:16 lacks the extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: plant_community
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: 'True'
      ENABLE_FILE_LOGGING: 'False'
      # Set explicitly so pytest uses the CI service credentials and database;
      # settings.py validates this is PostgreSQL before the suite starts.
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/plant_community'  # pragma: allowlist secret
      REDIS_URL: 'redis://localhost:6379/1'
      SECRET_KEY: 'ci-django-key-for-backend-checks-abcdefghijklmnopqrstuvwxyz1234567890'
      JWT_SECRET_KEY: 'ci-jwt-key-for-backend-checks-abcdefghijklmnopqrstuvwxyz1234567890-different'
      # Placeholder third-party API keys. test_services.py constructs the
      # PlantNet / Plant.id / Trefle service objects, which raise ValueError
      # unless their key is set in settings (all default ""). The HTTP calls are
      # mocked, so the value never goes on the wire — it only needs to be present
      # and >=32 chars to clear settings.py's length validation. NOT real secrets.
      # (Without these, 13 test_services.py tests fail in CI even though they pass
      # locally, where the dev .env supplies the keys.)
      PLANTNET_API_KEY: 'ci-placeholder-plantnet-key-000000000000'  # pragma: allowlist secret
      PLANT_ID_API_KEY: 'ci-placeholder-plantid-key-0000000000000'  # pragma: allowlist secret
      PLANT_HEALTH_API_KEY: 'ci-placeholder-planthealth-key-000000000'  # pragma: allowlist secret
      TREFLE_API_KEY: 'ci-placeholder-trefle-key-00000000000000'  # pragma: allowlist secret

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend test suite (pytest)
        # Runner is pytest (config in backend/pytest.ini), which ignores
        # apps/forum_integration tests and 2 plant_identification diagnosis test
        # files by design. The trailing pytest summary line ("N passed, M
        # skipped") is the recorded pass count for drift tracking. Baseline on
        # main at wiring time: 609 passed, 8 skipped (617 collected). A failing
        # test exits non-zero and fails this job.
        #
        # Keep this invocation BARE. backend/conftest.py prints the environment
        # stamp (interpreter, HEAD, dirty count, dependency drift counts) via
        # pytest_report_header, which _pytest gates on `verbosity >= 0` — adding
        # -qq or --no-header to quieten the log silently deletes it. This job is
        # the control that proves the stamp reads clean on a correct
        # environment, so losing it here would go unnoticed: the companion drift
        # warning only prints when there IS drift, and CI has none. See todo 379.
        run: python -m pytest
