name: Firebase rules drift

# Compares the rules DEPLOYED to Firebase against the ones committed here.
#
# Why: twice a rules change was committed and never deployed — todo 224
# (firestore:rules) and the 2026-05-23 Storage tightening, which sat undeployed
# for 3.5 months and was found by accident while checking an unrelated todo's
# acceptance criterion. Nothing in the repo can reveal this: the file, the
# firebase.json entry and an old green deploy log are all consistent with
# production serving something else. Only the Rules API knows.
#
# NOT a required status check, deliberately:
#   - it depends on federated credentials, and a required check that cannot run
#     deadlocks every PR (see the note at the top of harness-ci.yml);
#   - it reports on production state, which a PR author cannot fix by editing
#     their branch.
# Its offline unit tests DO run on every PR, inside Harness CI.
#
# AUTH: Workload Identity Federation — no key material exists anywhere, per
# firebase/docs/patterns/iam.md ("In CI/CD: use Workload Identity Federation
# instead of key files"). GitHub mints a short-lived OIDC token; GCP exchanges
# it for a short-lived access token. Provisioned 2026-09-12:
#
#   service account : firebase-rules-reader@plant-community-prod.iam.gserviceaccount.com
#                     (roles/firebaserules.viewer ONLY — read rulesets, nothing else)
#   pool / provider : github-actions / github
#   trust boundary  : the provider's attribute-condition pins
#                     assertion.repository == 'Xertox1234/plant_id_community',
#                     and the SA's workloadIdentityUser binding is scoped to the
#                     same principalSet. Both halves are required: without the
#                     condition, ANY GitHub repo could mint tokens for this pool.
#
# Repo VARIABLES (not secrets — neither value is sensitive):
#   GCP_WIF_PROVIDER    projects/190351417275/locations/global/workloadIdentityPools/github-actions/providers/github
#   GCP_RULES_READER_SA firebase-rules-reader@plant-community-prod.iam.gserviceaccount.com
#
# If they are unset the job FAILS rather than skipping, because a drift check
# that quietly passes when it cannot look is worse than no check at all.

'on':
  schedule:
    # 07:20 UTC daily. Drift is silent and open-ended, so time-to-detection is
    # the whole value; a weekly cadence would have cut 15 weeks to 14.
    - cron: '20 7 * * *'
  push:
    branches: [main]
    paths:
      - 'firebase/**.rules'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/check_firebase_rules_drift.py'
      - '.github/workflows/firebase-rules-drift.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Required for the OIDC token exchange. An explicit top-level block REPLACES
  # the repo default rather than narrowing it, so contents:read must be restated.
  id-token: write

concurrency:
  group: firebase-rules-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Deployed rules match committed rules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the drift report dates the last commit touching each
          # rules file to say WHICH side is stale, and only prod-behind-repo is
          # the incident shape. A shallow clone reports "direction unknown".
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install 'google-auth==2.50.0' 'requests==2.32.5'

      - name: Require the federation variables
        env:
          PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          SA: ${{ vars.GCP_RULES_READER_SA }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$SA" ]; then
            echo "::error::GCP_WIF_PROVIDER and/or GCP_RULES_READER_SA are unset, so deployed rules cannot be read."
            echo "Set both as repository VARIABLES (Settings > Secrets and variables > Actions > Variables)."
            echo "They are resource identifiers, not credentials — neither is sensitive."
            exit 1
          fi

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_RULES_READER_SA }}

      - name: Compare deployed rules with committed rules
        # No --credentials: the auth step above exports an external_account
        # config via GOOGLE_APPLICATION_CREDENTIALS, which the script routes to
        # google.auth.default(). It is NOT a service-account key, and the
        # service-account loader cannot parse one — see credential_type().
        run: python3 scripts/check_firebase_rules_drift.py
