name: kimi-review

# Server-side code review. Runs the vendored kimi-review CLI over each PR diff
# with Tier B agentic verification; a verified CRITICAL finding (engine exit code
# 2) fails this job. Unlike the local pre-commit hook, it runs for every
# contributor regardless of whether they have the kimi-review CLI installed.
#
# Advisory, not a merge gate (corrected 2026-07-30). The job declares no `name:`,
# so its status context is `kimi-review`, which is NOT among main's required
# status checks — a failure here does not block a merge. It is also inert today:
# no `OPENROUTER_API_KEY` repository secret exists, so the run self-skips at the
# guard below. Wiring it up as a real gate means adding that secret AND adding
# `kimi-review` to the required contexts.

on:
  pull_request:
    branches: [main]

# A newer push to the same PR cancels an in-flight review run.
concurrency:
  group: kimi-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN. An explicit top-level block REPLACES the repo
# default (`default_workflow_permissions: read`) rather than narrowing it, so
# every scope any job here needs must be listed. See docs/rules/security.md.
permissions:
  contents: read

jobs:
  kimi-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the base..HEAD diff can be computed.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install kimi-review dependencies
        # The structured-output draft + agentic verify loop need a recent SDK.
        run: pip install --quiet "openai>=1.40,<2"

      - name: Run kimi-review on the PR diff
        env:
          # kimi-review reads WORKER_API_KEY or OPENROUTER_API_KEY.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::OPENROUTER_API_KEY secret is not set — kimi-review gate skipped."
            exit 0
          fi

          # Owner rule: the cheap-worker model never sees authentication,
          # permissions, input validation, migrations or security-sensitive
          # code. A PR that changes any such file is not reviewed here at all:
          # filtering the diff would not be enough, because the agentic verify
          # step reads the working tree. Markdown is not code and never skips.
          SENSITIVE='(^backend/apps/users/|/migrations/|^firebase/.*\.rules$|auth|permission|validat|sanitiz|security|csrf|jwt|secret|password|credential)'
          HITS=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
            | grep -v '\.md$' | grep -i -E "$SENSITIVE" || true)
          if [ -n "$HITS" ]; then
            echo "::notice::kimi-review skipped: this PR changes security-sensitive files, which the cheap-worker model must not read."
            echo "$HITS"
            exit 0
          fi

          # Tier B agentic verify reads the working tree; under the pull_request
          # trigger that is already the PR-head checkout, so no head-sha is needed.
          if REVIEW=$(git diff "${{ github.event.pull_request.base.sha }}...HEAD" \
            | python3 scripts/kimi-review \
                --scope "PR #${{ github.event.pull_request.number }}" \
                --profile plant_id \
                --verify agentic \
                --tiers CRITICAL,WARNING 2>&1); then
            STATUS=0
          else
            STATUS=$?
          fi
          echo "$REVIEW"

          # Engine exit 2 = a CRITICAL survived verification → block the merge.
          if [ "$STATUS" -eq 2 ]; then
            echo "::error::kimi-review reported a verified CRITICAL finding — see the log above."
            exit 1
          fi
          # CI fails closed on any other tool error (the local gate fails open).
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::kimi-review failed to run (exit $STATUS)."
            exit "$STATUS"
          fi
          echo "kimi-review: no CRITICAL findings."
