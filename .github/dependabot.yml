# Dependabot VERSION updates. Security updates are a repository setting and run
# with or without this file.
#
# A previous config was removed on 2026-05-07 (e447347e) because it was noisy:
# four or five groups per ecosystem and up to 10 open PRs each. This one is
# built to stay quiet:
#
#   - ONE grouped PR per ecosystem per week for every minor and patch update.
#   - Major updates arrive one PR each, are held back 30 days after release
#     (where the ecosystem reports SemVer) and are capped by
#     `open-pull-requests-limit`. Close one with `@dependabot ignore this major
#     version` to decline it for good.
#   - Nothing newer than 7 days is proposed (`cooldown`), so a release that is
#     yanked or found malicious in its first week never reaches a PR.
#   - No `ignore` rule filters by update type: an ignore rule must never be able
#     to hold back a security fix that happens to be a major bump (soupsieve
#     2.9 -> 4.0, #1302).
#
# Runs Tuesday, the day after the weekly security scan (Monday 09:00 UTC).
#
# ruff is excluded everywhere: its pin in backend/requirements.txt must equal
# the ruff-pre-commit rev in .pre-commit-config.yaml, and Dependabot would bump
# the two in separate PRs. Bump both by hand, together.

version: 2

updates:
  # Backend. requirements.txt is a full freeze, so a transitive pin can be
  # bumped past what its parent allows; `pip install` in backend-ci fails on
  # that, which is the signal to drop that one bump from the group.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      - dependency-name: "ruff"
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Web app and the repo-root Cloudflare Workers deploy tree.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/web"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Flutter app.
  - package-ecosystem: "pub"
    directory: "/plant_community_mobile"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels: ["dependencies", "area: mobile"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      pub-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Android build plugins (AGP, Kotlin, google-services).
  - package-ecosystem: "gradle"
    directory: "/plant_community_mobile/android"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 2
    labels: ["dependencies", "area: mobile"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Workflow actions: one PR for all of them, majors included.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # backend/Dockerfile base image (python:3.13-slim).
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  # .pre-commit-config.yaml hook revs: one PR for all of them.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(dev)"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*ruff*"
    groups:
      pre-commit-hooks:
        patterns: ["*"]
