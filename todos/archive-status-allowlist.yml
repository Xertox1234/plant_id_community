# ---------------------------------------------------------------------------
# Every archived todo that already had bare unchecked acceptance criteria when
# the ARCHIVED_UNCHECKED_AC rule landed on 2026-09-13. One dated snapshot, not
# 62 individual judgements -- so paths only, no per-entry reason.
#
# This is the rule todo 390 AC 5 asked for, and it is the half that binds: the
# skill text it also asks for reaches only NEW worktrees, while this runs on
# every PR. It closes the hole AC 4's rule leaves open -- a todo archived with
# `status: completed` and 38 unchecked ACs passes the archived-while-open rule
# cleanly (todos/archive/2025-11-05-011-completed-p2-sql-wildcard-sanitization.md
# is exactly that).
#
# A file leaves this list by having its ACs checked off or re-pointed, never by
# being added back. A stale entry -- one whose file no longer has bare unchecked
# ACs -- fails the check, same as above.
#
# The exemption is deliberately narrow: an unchecked AC is excused only if it
# names a target todo AND says it was re-pointed, per CLAUDE.md's convention
#   - [ ] #M2 bookmarks -> todo 283 (re-pointed 2026-07-26; promoted out of 263)
# Zero of these 62 files clear that bar today. That is the honest starting
# point: the exemption exists for future archivals, not to excuse the past.
#
# NOTE for whoever works through these: renaming an archived todo makes its
# .secrets.baseline entries stale (the baseline is keyed by filename), and the
# detect-secrets pre-commit hook will block the commit. Fix it with a
# filename-only edit to .secrets.baseline -- NEVER regenerate it, which adds
# ~28 entries including the file that held the leaked Plant.id key.

