# Grandfathered archived todos — DATA for scripts/check_archived_todo_status.py.
#
# Every file here is archived while its frontmatter still says the work is open.
# They predate the check, so the check would fail on day one without them. That
# is the only reason this file exists.
#
# THIS IS NOT A MUTE BUTTON. A stale entry — one whose file no longer violates,
# or no longer exists — FAILS the check. So the list can only shrink, and the
# way to remove an entry is to establish what actually happened and fix the
# file's frontmatter. Without that rule an allowlist quietly becomes permanent:
# `.github/security-suppressions.yml` documents the same decay hiding 19
# advisories for two months.
#
# kind:
#   not-triaged  Nobody has confirmed the work landed. The `hint` records what a
#                grep turned up — a STARTING POINT, never a verdict. Writing
#                `status: completed` on the strength of a hint is precisely the
#                falsification this checker exists to prevent, and it is what
#                cost eleven months on the PlantNet key (see todo 390).
#
# Sixteen of the original 29 violations were resolved on 2026-09-13 rather than
# listed here, each with its evidence recorded in the file's own Work Log. These
# thirteen are what was left when the cheap, decisive greps ran out. Todo 394
# tracks shrinking them.

