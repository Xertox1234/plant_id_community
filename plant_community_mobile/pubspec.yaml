name: plant_community_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+10

environment:
  sdk: ^3.10.0  # CI resolves latest stable via channel: stable

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0

  # Firebase
  firebase_core: ^5.2.0  # >=4.15.1 pins Firebase iOS SDK 12.19.3 (Firestore eMudhra CA fix)
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  firebase_messaging: ^17.1.0  # Push notifications (16.7 adds AuthorizationStatus.deniedPermanently)

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^18.1.4

  # Image Handling
  image_picker: ^1.2.4
  cached_network_image: ^4.0.7
  flutter_cache_manager: ^3.5.0  # Private scan-photo cache, emptied on sign-out (scan-2 audit M7)

  # HTTP
  dio: ^5.11.1
  http: ^1.2.2  # For weather API calls
  http_parser: ^4.1.2  # MediaType for multipart part Content-Types

  # Utils
  intl: ^0.20.1
  uuid: ^4.5.2
  logger: ^2.8.0
  html: ^0.15.7  # Parse sanitized forum StreamField paragraph HTML for rendering

  # Secure Storage
  flutter_secure_storage: ^11.2.0  # Secure JWT token storage

  # Notifications
  flutter_local_notifications: ^23.0.2  # Local notification scheduling

  path_provider: ^2.1.6  # For database file paths
  path: ^1.9.1  # Path manipulation

  # Permissions
  permission_handler: ^13.0.2  # For opening app settings (notification and camera permissions)
  google_sign_in: ^7.2.0

  # Icons — the web uses lucide-react; this is the same icon set as a Flutter
  # icon font, so both platforms draw identical glyphs at identical weights.
  # Icon-font package (one IconData per glyph), so Flutter's --tree-shake-icons
  # keeps only the glyphs actually referenced.
  lucide_icons_flutter: ^4.0.3

  # Opens forum links in the in-app browser (SFSafariViewController / Custom
  # Tab). Only http(s) is ever handed to it (todo 424).
  url_launcher: ^6.3.3
  # The device's IANA zone ("America/Denver") for quiet hours; Dart's own
  # DateTime.timeZoneName is only an abbreviation (todo 624, owner decision
  # 2026-10-13).
  flutter_timezone: ^5.1.1
  camera: ^0.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Emulator-backed integration tests (run on a device/simulator, not the
  # default `flutter test` which only scans test/). See
  # integration_test/firestore_emulator_roundtrip_test.dart.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.0+1
  flutter_dotenv: ^6.0.0  # Legacy tests/docs only; runtime config uses --dart-define
  fake_cloud_firestore: ^4.5.0

  # Test seam for push_message_router_service_test.dart: drives
  # FirebaseMessagingPlatform.onMessageOpenedApp directly (todo 311). Already
  # a transitive dependency at this resolved version; listed explicitly to
  # satisfy depend_on_referenced_packages now a test file imports it.
  firebase_messaging_platform_interface: ^4.12.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Flutter 3.47 migrates iOS plugins from CocoaPods to Swift Package Manager.
  # Off for now (todo 693): that move is its own change, made once every local
  # SDK is >= 3.47. When it lands, un-ignore swiftpm/Package.resolved so the
  # Firebase iOS SDK pin stays committed (Podfile.lock holds it today).
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Runtime configuration is supplied with --dart-define. Do not require
  # ignored .env files as build assets in fresh checkouts.

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-SemiBoldItalic.ttf
          weight: 600
          style: italic
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
