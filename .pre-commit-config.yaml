# Pre-commit hooks for Plant ID Community
# Installation:
#   pip install pre-commit
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files
#
# Update hooks:
#   pre-commit autoupdate

repos:
  # ===================================
  # Secret Detection (Critical - Issue #1 Prevention)
  # ===================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets in code
        args:
          - '--baseline'
          - '.secrets.baseline'
          - '--exclude-files'
          - '\.env\.example$'
          - '--exclude-files'
          - 'package-lock\.json$'
          - '--exclude-files'
          - 'yarn\.lock$'
        exclude: |
          (?x)^(
            .*\.lock$|
            .*\.min\.js$|
            .*\.g\.dart$|
            backend/docs/development/SECURITY_INCIDENT_.*\.md$
          )

  # ===================================
  # Git Security (Issue #1 Prevention)
  # ===================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Prevent committing large files
      - id: check-added-large-files
        args: ['--maxkb=10240']  # 10MB limit
        name: Check for large files

      # Prevent committing files with merge conflicts
      - id: check-merge-conflict
        name: Check for merge conflicts

      # Prevent committing to protected branches
      - id: no-commit-to-branch
        name: Prevent commits to main/master
        args: ['--branch', 'main', '--branch', 'master']

      # Check YAML syntax
      - id: check-yaml
        name: Check YAML syntax
        exclude: '^plant_community_mobile/'  # Flutter pubspec.yaml can have special syntax

      # Check JSON syntax
      - id: check-json
        name: Check JSON syntax

      # Trim trailing whitespace
      - id: trailing-whitespace
        name: Trim trailing whitespace
        args: ['--markdown-linebreak-ext=md']

      # Ensure files end with newline
      - id: end-of-file-fixer
        name: Fix end of files

      # Check for private keys
      - id: detect-private-key
        name: Detect private keys

  # ===================================
  # Custom Secret Detection Rules (Issue #1 Specific)
  # ===================================
  - repo: local
    hooks:
      # Block .env files (except .env.example)
      - id: block-env-files
        name: Block .env files (use .env.example instead)
        entry: bash -c 'if git diff --cached --name-only | grep -E "\.env$|\.env\.local$|\.env\.production$" | grep -v "\.env\.example"; then echo "ERROR - .env files must NOT be committed. Use .env.example for templates."; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

      # Scan for API key patterns in staged files
      - id: scan-api-keys
        name: Scan for exposed API keys in code
        entry: bash -c 'for file in $(git diff --cached --name-only); do if [[ -f "$file" ]] && ! [[ "$file" =~ \.env\.example$ ]]; then if grep -HnE "[A-Z_]+_API_KEY\s*=\s*[A-Za-z0-9_\-]{20,}" "$file" 2>/dev/null; then echo "WARNING - Potential API key detected in $file. Verify this is a placeholder."; fi; fi; done'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      # Scan for Django SECRET_KEY patterns
      - id: scan-django-secrets
        name: Scan for Django SECRET_KEY in code
        entry: bash -c 'for file in $(git diff --cached --name-only); do if [[ -f "$file" ]] && ! [[ "$file" =~ \.env\.example$ ]]; then if grep -HnE "SECRET_KEY\s*=\s*[A-Za-z0-9!@#\$%^&*()_+\-=\[\]{}|;:,.<>?]{40,}" "$file" 2>/dev/null; then echo "WARNING - Potential Django SECRET_KEY detected in $file."; fi; fi; done'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      # Verify .gitignore contains critical patterns
      - id: verify-gitignore
        name: Verify .gitignore has security patterns
        entry: bash -c 'if ! grep -q "^CLAUDE.md$" .gitignore; then echo "ERROR - Add CLAUDE.md to .gitignore"; exit 1; fi; if ! grep -q "^.env$" .gitignore; then echo "ERROR - Add .env to .gitignore"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

  # ===================================
  # Claude Code Harness Integrity
  # ===================================
  - repo: local
    hooks:
      - id: check-agent-frontmatter
        name: Validate .claude/agents/*.md frontmatter is loadable
        entry: python3 scripts/inject/check_agent_frontmatter.py
        language: system
        files: ^\.claude/agents/.*\.md$
        pass_filenames: false

  # ===================================
  # Python Code Quality
  # ===================================
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        name: Format Python code with Black
        language_version: python3
        files: ^backend/.*\.py$

  # ruff replaced flake8 (2026-10-18): same pyflakes/pycodestyle rules plus the
  # bug-finding families (bugbear, flake8-django, pylint errors, leftover
  # breakpoints, implicit string concatenation). Config: backend/pyproject.toml
  # [tool.ruff], discovered hierarchically, so the cwd no longer matters. The
  # rev must equal the ruff== pin in backend/requirements.txt.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-check
        name: Lint Python with ruff
        files: ^backend/.*\.py$

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort Python imports
        args: ['--profile', 'black']
        files: ^backend/.*\.py$

  # ===================================
  # Backend type-check of the files in this commit
  # ===================================
  - repo: local
    hooks:
      # mypy on the staged backend files (django-stubs plugin, backend/venv).
      # Blocks for files under the gated paths in backend/pyproject.toml
      # [tool.mypy] files (the CI gate); one advisory count line for the rest.
      # Tests never block: the `apps.*.tests.*` ignore_errors override in
      # pyproject.toml is the policy (owner decision 2026-10-19); the exclude
      # here only saves the mypy start-up on a tests-only commit.
      # SKIP=mypy-staged bypasses once.
      - id: mypy-staged
        name: Type-check staged backend files (mypy)
        entry: python3 scripts/mypy_staged.py
        language: system
        files: ^backend/.*\.py$
        exclude: /(migrations|tests)/
        verbose: true  # pre-commit hides a passing hook's output; the advisory lines need it

  # ===================================
  # Backend tests for the test files in this commit
  # ===================================
  - repo: local
    hooks:
      # Runs pytest on exactly the backend test files staged in this commit
      # (needs the local Postgres + Redis, like any backend pytest run). A
      # commit that stages no test file pays nothing. Root-level backend/test_*.py
      # are standalone scripts outside pytest.ini's testpaths, so the scope is
      # apps/ and packages/. SKIP=pytest-staged bypasses once (for example when
      # another pytest run already holds the test database).
      - id: pytest-staged
        name: Run staged backend tests (pytest)
        entry: scripts/test-staged.sh backend
        language: script
        files: ^backend/(apps|packages)/.*test.*\.py$

  # ===================================
  # JavaScript/TypeScript Code Quality
  # ===================================
  - repo: local
    hooks:
      - id: eslint-web
        name: Lint JS/TS with ESLint
        entry: bash -c 'cd web && npm run lint'
        language: system
        files: ^web/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false

      - id: prettier-web
        name: Check JS/TS formatting with Prettier
        entry: bash -c 'cd web && npx prettier --check "**/*.{js,jsx,ts,tsx}"'
        language: system
        files: ^web/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false

      # Type errors used to surface only in web-ci's `tsc --noEmit` step; now
      # they block the commit (~4 s). Whole-project check: a change in one file
      # can break a type in another, so the staged list is not enough.
      - id: tsc-web
        name: Type-check web with tsc --noEmit
        entry: bash -c 'cd web && npm run --silent type-check'
        language: system
        files: ^web/(.*\.(ts|tsx)|tsconfig\.json|package\.json)$
        pass_filenames: false

      # Run the web test files staged in this commit (vitest). A commit that
      # stages no test file pays nothing. SKIP=vitest-staged bypasses once.
      - id: vitest-staged
        name: Run staged web tests (vitest)
        entry: scripts/test-staged.sh web
        language: script
        files: ^web/src/.*\.(test|spec)\.(js|jsx|ts|tsx)$

  # ===================================
  # Flutter/Dart Code Quality
  # ===================================
  # Every Flutter hook drops git's hook variables (env -u GIT_*): Flutter's
  # bin/flutter and bin/dart run `git rev-parse HEAD` in the SDK, and in a
  # worktree commit the exported GIT_DIR points that at THIS repo. The SDK then
  # rebuilds its tool, reports 0.0.0-unknown and pub refuses to resolve
  # (2026-10-19; scripts/test-staged.sh and check_flutter_codegen.py too).
  - repo: local
    hooks:
      - id: flutter-analyze
        name: Analyze Flutter with flutter analyze
        entry: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE -u GIT_PREFIX bash -c 'flutter analyze plant_community_mobile/'
        language: system
        files: ^plant_community_mobile/.*\.dart$
        pass_filenames: false

      - id: dart-format
        name: Check Dart formatting with dart format
        entry: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE -u GIT_PREFIX bash -c 'dart format --output=none --set-exit-if-changed plant_community_mobile/lib/'
        language: system
        files: ^plant_community_mobile/.*\.dart$
        pass_filenames: false

      # Riverpod embeds a hash of each provider's source in its .g.dart, so any
      # edit to that file makes it stale while analyze and test still pass. Runs
      # build_runner (as mobile CI does) only when a staged file declares a
      # `part '*.g.dart'`; a stale file fails the commit, regenerated in place.
      - id: flutter-codegen
        name: Regenerate Flutter codegen (build_runner) when a provider changed
        entry: python3 scripts/check_flutter_codegen.py
        language: system
        files: ^plant_community_mobile/lib/.*\.dart$
        exclude: \.(g|freezed)\.dart$

      # Run the Flutter test files staged in this commit. A commit that stages
      # no test file pays nothing. SKIP=flutter-test-staged bypasses once.
      - id: flutter-test-staged
        name: Run staged Flutter tests (flutter test)
        entry: scripts/test-staged.sh flutter
        language: script
        files: ^plant_community_mobile/test/.*_test\.dart$

  # ===================================
  # Markdown Linting
  # ===================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ['--fix']
        # TEMPLATE.md is excluded for two reasons, both structural rather than
        # cosmetic: its <Concise Issue Title> placeholders are read as inline
        # HTML (MD033), and --fix inserts a blank line after the frontmatter
        # `---`, which would break the frontmatter of every todo copied from it.
        # The frontmatter now sits at the top of that file so the second issue
        # cannot recur, but the placeholders are deliberate and stay.
        exclude: |
          (?x)^(
            PLANNING/.*|
            backend/docs/development/SECURITY_INCIDENT_.*\.md$|
            todos/archive/.*\.md$|
            docs/archive/.*\.md$|
            docs/reviews/.*\.md$|
            todos/TEMPLATE\.md$
          )

  # ===================================
  # Trailing Whitespace & File Endings
  # ===================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ['--fix=lf']

  # ===================================
  # kimi-review staged-diff gate
  # ===================================
  - repo: local
    hooks:
      - id: kimi-review
        name: kimi-review staged-diff gate (CRITICAL blocks)
        entry: bash scripts/kimi-precommit.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

# ===================================
# Hook Execution Order
# ===================================
# 1. Secret detection (CRITICAL - blocks commit if secrets found)
# 2. Custom secret rules (CRITICAL - Issue #1 specific checks)
# 3. Git security checks (large files, merge conflicts, etc.)
# 4. Code quality (formatting, linting, agent frontmatter validation)
# 5. File cleanup (whitespace, line endings)
# 6. kimi-review staged-diff gate (CRITICAL blocks; SKIP_KIMI_REVIEW=1 bypasses)

# ===================================
# Configuration Notes
# ===================================
# - All hooks run automatically on `git commit`
# - Hooks can be skipped with: git commit --no-verify (NOT RECOMMENDED)
# - Update hooks monthly: pre-commit autoupdate
# - Generate secrets baseline: detect-secrets scan > .secrets.baseline
# - Add false positives to .secrets.baseline using: detect-secrets audit .secrets.baseline

# ===================================
# Issue #1 Prevention
# ===================================
# This configuration specifically prevents the issues identified in Issue #1:
# 1. CLAUDE.md blocking - Prevents committing local development context file
# 2. .env file blocking - Ensures environment files are never committed
# 3. API key scanning - Detects potential real credentials in code
# 4. .gitignore verification - Ensures security patterns are present
# 5. detect-secrets - Industry-standard secret detection tool
#
# See: backend/docs/development/SECURITY_PATTERNS_CODIFIED.md for complete analysis
