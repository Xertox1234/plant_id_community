<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two-step sign-in</title>
</head>
<body>
  <main>
    <h1>Two-step sign-in</h1>
    <p>Enter the 6-digit code from your authenticator app, or a one-time
      recovery code.</p>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label for="token">Code</label>
      <input id="token" name="token" autocomplete="one-time-code" required autofocus>
      <button type="submit">Verify</button>
    </form>
    <p><a href="/cms/logout/">Sign out</a></p>
  </main>
</body>
</html>
