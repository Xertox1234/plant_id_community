[pytest]
# Django settings module for tests
DJANGO_SETTINGS_MODULE = plant_community_backend.settings

# Python paths
pythonpath = .

# Test discovery patterns
testpaths = apps packages
python_files = test_*.py *_test.py
python_classes = Test* *Test *TestCase
python_functions = test_*

# Additional options for pytest
addopts =
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --ignore=apps/plant_identification/test_diagnosis_api.py
    --ignore=apps/plant_identification/test_diagnosis_models.py

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with -m 'not slow')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests as API endpoint tests
    models: marks tests for model functionality
    services: marks tests for service layer
    external_api: marks tests that require external API access
    forum: marks tests for forum functionality
    plant_id: marks tests for plant identification
    disease_diagnosis: marks tests for disease diagnosis
    auth: marks tests for authentication/authorization

# Filtering options
filterwarnings =
    always::DeprecationWarning
    always::PendingDeprecationWarning
    # Todo 364: a first-party RemovedInDjango70Warning fails the run, so the
    # gate is live before the Django 7.0 jump. The two third-party frames
    # below are exempted narrowly (message + module), and todo 452 tracks
    # removing each one once upstream ships a fix:
    # - django-taggit: taggit/managers.py ExtraJoinRestriction.as_sql calls
    #   compiler.quote_name_unless_alias() (Django ticket #36795,
    #   https://github.com/jazzband/django-taggit/blob/master/taggit/managers.py)
    # - Wagtail admin workflow mail: wagtail/admin/mail.py send_emails calls
    #   get_connection() (https://github.com/wagtail/wagtail/blob/main/wagtail/admin/mail.py).
    #   It still works under MAILERS (get_connection returns the default mailer).
    error::django.utils.deprecation.RemovedInDjango70Warning
    ignore:SQLCompiler\.quote_name_unless_alias\(\) is deprecated:django.utils.deprecation.RemovedInDjango70Warning:taggit\.managers
    ignore:get_connection\(\) is deprecated:django.utils.deprecation.RemovedInDjango70Warning:wagtail\.admin\.mail

# Note: DATABASES and django_find_project options removed; pytest-django uses
# DJANGO_SETTINGS_MODULE and project discovery via pythonpath/testpaths.
