[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start permissive
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
# The CI gate (todo 580) checks one app at a time: `mypy apps/users`. A module
# reached only by import is still analysed for types, but its own errors are not
# reported; every file named on the command line always is. Widening the gate
# means adding an app to the command line, not changing this.
follow_imports = "silent"

# Strict checking for service layer
[[tool.mypy.overrides]]
module = "apps.plant_identification.services.*"
disallow_untyped_defs = false  # Permissive for now, some services still need work
warn_unreachable = true
strict_optional = true

# Django-specific overrides
[[tool.mypy.overrides]]
module = "apps.plant_identification.models"
ignore_errors = true

# Generated migrations are excluded from the users gate (owner decision,
# todo 580): they are machine-written and never hand-edited.
[[tool.mypy.overrides]]
module = "apps.users.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "plant_community_backend.settings"
