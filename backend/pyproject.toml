[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start permissive
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
# The gated paths (todo 580): a bare `python -m mypy` checks exactly these, and
# that is what the CI step, bin/test-mypy-gate.sh and the mypy-staged pre-commit
# hook (scripts/mypy_staged.py, which blocks only for files under these paths)
# all use. Widen the gate by adding a path here, nowhere else. Tests are
# excluded from the gate by the tests overrides below (owner
# decision 2026-10-19), so gating a new app means fixing its SOURCE errors
# only. Every backend app and package is gated since todo 659.
files = [
    "apps/users",
    "apps/forum_host",
    "apps/blog",
    "apps/core",
    "apps/garden_calendar",
    "apps/plant_identification",
    "plant_community_backend",
    # The reusable forum package's importable root (module `wagtail_forum.*`).
    "packages/wagtail_forum/wagtail_forum",
]
# A module reached only by import is still analysed for types, but its own
# errors are not reported; every file in `files` or named on the command line
# always is.
follow_imports = "silent"

# Strict checking for service layer
[[tool.mypy.overrides]]
module = "apps.plant_identification.services.*"
disallow_untyped_defs = false  # Permissive for now, some services still need work
warn_unreachable = true
strict_optional = true

# Generated migrations are excluded from the users gate (owner decision,
# todo 580): they are machine-written and never hand-edited.
[[tool.mypy.overrides]]
module = "apps.users.migrations.*"
ignore_errors = true

# Tests are excluded from the mypy gate (owner decision 2026-10-19: 615 of the
# 1,097 errors measured across the tree were in tests; DRF test clients and
# `response.data` on a plain TestCase are the bulk and are not bugs). An
# override, not `exclude`: `exclude` only limits directory discovery, so CI's
# bare run would skip tests while the mypy-staged hook, which names staged
# files on the command line, still blocked on them. ignore_errors applies in
# both. `*` matches zero or more module components, so this covers
# `apps.users.tests` and every submodule; `wagtail_forum.tests.*` does the same
# for the forum package (warn_unused_configs flags either pattern once it
# stops matching). A few older test modules sit at an app's root instead of
# under tests/; `*` cannot match part of a component (`test_*`), so they are
# named one by one (todo 659).
[[tool.mypy.overrides]]
module = [
    "apps.*.tests.*",
    "wagtail_forum.tests.*",
    "apps.core.test_basic",
    "apps.plant_identification.test_api",
    "apps.plant_identification.test_circuit_breaker_locks",
    "apps.plant_identification.test_executor_caching",
    "apps.plant_identification.test_models",
    "apps.plant_identification.test_services",
]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "plant_community_backend.settings"

# ---------------------------------------------------------------------------
# ruff: the Python lint gate (replaced flake8 in the pre-commit hook and the
# backend-checks CI job). Bug-finding rule families on top of pyflakes/
# pycodestyle parity; black + isort still own formatting. ruff discovers this
# file hierarchically, so the gate reads the same config from any cwd.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",    # pyflakes: undefined/unused names, redefinitions
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear: raise-without-from, unused loop vars, blind asserts
    "T10",  # leftover breakpoint()/pdb calls
    "PLE",  # pylint errors (not conventions or refactors)
    "DJ",   # flake8-django: missing __str__, locals() in render, form field lists
    "ISC",  # implicit string concatenation (the missing-comma-in-a-list bug)
]
ignore = [
    "E203",  # whitespace before ':' — black's slice style
    "B905",  # zip(strict=) — deciding strict=True per call site is its own change
    "DJ001", # null=True on CharField — dropping it is a schema migration, not lint
    "DJ012", # model member ordering — style, not a bug
]

[tool.ruff.lint.per-file-ignores]
# Import-smoke-test: imports modules solely to verify they load.
"test_django_imports.py" = ["F401", "F841"]
