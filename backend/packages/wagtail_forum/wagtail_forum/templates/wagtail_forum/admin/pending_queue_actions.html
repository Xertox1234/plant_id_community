{% load i18n %}
<td>
    <div class="w-flex w-gap-2 w-items-center">
        <form method="post" action="{{ approve_url }}">
            {% csrf_token %}
            <input type="hidden" name="revision" value="{{ revision_id }}">
            <button type="submit" class="button button-small">{% trans "Approve" %}</button>
        </form>
        {% if reject_url %}
            <a href="{{ reject_url }}" class="button button-small button-secondary no">{% trans "Reject" %}</a>
        {% endif %}
    </div>
</td>
